name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install (CPU torch — no CUDA wheels needed for the test suite)
        run: |
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      # HH-RLHF is ~78MB and never changes; keep it between runs.
      - name: Cache HH-RLHF
        uses: actions/cache@v4
        with:
          path: data/raw
          key: hh-rlhf-v1

      - name: Fetch data
        run: python scripts/fetch_data.py

      - name: Run tests
        run: python -m pytest tests -q

      # A two-minute end-to-end run with the offline backbone: proves train -> probe ->
      # report still wires together. Not a scientific result.
      - name: Smoke run
        run: make smoke
